<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圍籬進銷存 - 管理後台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f2f5;min-height:100vh}
.header{background:#667eea;color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:20px;font-weight:700}
.header-right{display:flex;gap:12px;align-items:center}
.header-right span{font-size:14px;opacity:.9}
.logout-btn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:14px}
.logout-btn:hover{background:rgba(255,255,255,.3)}
.container{max-width:1200px;margin:0 auto;padding:24px}
.tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.tab{padding:10px 20px;background:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;color:#667}
.tab.active{background:#667eea;color:#fff}
.tab:hover:not(.active){background:#e8ecf4}
.card{background:#fff;border-radius:12px;padding:24px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card h2{font-size:18px;margin-bottom:16px;color:#333}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.form-grid input,.form-grid select,.form-grid textarea{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px}
.form-grid input:focus,.form-grid select:focus,.form-grid textarea:focus{outline:none;border-color:#667eea}
.btn{background:#667eea;color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500}
.btn:hover{background:#5a6fd6}
.btn-danger{background:#e74c3c}
.btn-danger:hover{background:#c0392b}
.btn-sm{padding:6px 12px;font-size:13px}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;text-align:left;border-bottom:1px solid #eee;font-size:14px}
th{background:#f8f9fb;color:#667;font-weight:600}
tr:hover{background:#f8f9fb}
.badge{padding:4px 8px;border-radius:6px;font-size:12px;font-weight:600}
.low-stock{color:#e74c3c;font-weight:600}
.hidden{display:none}
.login-wrap{max-width:400px;margin:100px auto;background:#fff;border-radius:16px;padding:40px;box-shadow:0 4px 20px rgba(0,0,0,.1)}
.login-wrap h2{text-align:center;margin-bottom:24px;color:#333}
.login-wrap input{width:100%;padding:12px;margin-bottom:12px;border:1px solid #ddd;border-radius:8px;font-size:14px}
.login-wrap .btn{width:100%;padding:14px}
#alert-box{position:fixed;top:80px;right:24px;background:#333;color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .3s;z-index:1000}
#alert-box.show{opacity:1}
</style>
</head>
<body>
<div id="alert-box"></div>

<div id="login-view" class="login-wrap">
  <h2>圍籬進銷存</h2>
  <input type="text" id="username" placeholder="帳號">
  <input type="password" id="password" placeholder="密碼">
  <button class="btn" id="login-btn">登入</button>
</div>

<div id="main-view" class="hidden">
  <div class="header">
    <h1>圍籬進銷存</h1>
    <div class="header-right">
      <span id="user-info"></span>
      <button class="logout-btn" id="logout-btn">登出</button>
    </div>
  </div>
  <div class="container">
    <div class="tabs">
      <button class="tab active" data-tab="inventory">庫存</button>
      <button class="tab" data-tab="products">配件</button>
      <button class="tab" data-tab="orders">訂單</button>
      <button class="tab" data-tab="purchases">進貨</button>
    </div>

    <div id="tab-inventory" class="tab-content">
      <div class="card">
        <h2>庫存列表</h2>
        <div id="inventory-list"></div>
      </div>
    </div>

    <div id="tab-products" class="tab-content hidden">
      <div class="card">
        <h2>新增配件</h2>
        <div class="form-grid">
          <input type="text" id="p-sku" placeholder="SKU 編號">
          <input type="text" id="p-name" placeholder="配件名稱">
          <select id="p-category"><option value="">選擇分類</option></select>
          <input type="text" id="p-unit" placeholder="單位" value="個">
          <input type="number" id="p-price" placeholder="單價">
        </div>
        <button class="btn" id="add-product-btn">新增配件</button>
      </div>
      <div class="card">
        <h2>配件列表</h2>
        <div id="products-list"></div>
      </div>
    </div>

    <div id="tab-orders" class="tab-content hidden">
      <div class="card">
        <h2>新增訂單</h2>
        <div class="form-grid">
          <input type="text" id="o-customer" placeholder="客戶名稱">
          <select id="o-product"><option value="">選擇配件</option></select>
          <input type="number" id="o-quantity" placeholder="數量">
          <input type="number" id="o-price" placeholder="單價">
        </div>
        <button class="btn" id="add-order-btn">新增訂單</button>
      </div>
      <div class="card">
        <h2>訂單列表</h2>
        <div id="orders-list"></div>
      </div>
    </div>

    <div id="tab-purchases" class="tab-content hidden">
      <div class="card">
        <h2>新增進貨</h2>
        <div class="form-grid">
          <select id="pu-product"><option value="">選擇配件</option></select>
          <input type="number" id="pu-quantity" placeholder="數量">
          <input type="number" id="pu-price" placeholder="單價">
          <input type="text" id="pu-supplier" placeholder="供應商">
          <input type="text" id="pu-notes" placeholder="備註">
        </div>
        <button class="btn" id="add-purchase-btn">新增進貨</button>
      </div>
      <div class="card">
        <h2>進貨列表</h2>
        <div id="purchases-list"></div>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  var API = '';
  var token = localStorage.getItem('inv_token');
  var user = null;

  function showAlert(msg) {
    var el = document.getElementById('alert-box');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(function() { el.classList.remove('show'); }, 3000);
  }

  function showTab(name) {
    document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
    document.querySelectorAll('.tab-content').forEach(function(t) { t.classList.add('hidden'); });
    document.querySelector('[data-tab="' + name + '"]').classList.add('active');
    document.getElementById('tab-' + name).classList.remove('hidden');
    if (name === 'inventory') loadInventory();
    if (name === 'products') loadProducts();
    if (name === 'orders') loadOrders();
    if (name === 'purchases') loadPurchases();
  }

  document.querySelector('[data-tab="inventory"]').addEventListener('click', function() { showTab('inventory'); });
  document.querySelector('[data-tab="products"]').addEventListener('click', function() { showTab('products'); });
  document.querySelector('[data-tab="orders"]').addEventListener('click', function() { showTab('orders'); });
  document.querySelector('[data-tab="purchases"]').addEventListener('click', function() { showTab('purchases'); });

  document.getElementById('login-btn').addEventListener('click', doLogin);
  document.getElementById('logout-btn').addEventListener('click', doLogout);
  document.getElementById('add-product-btn').addEventListener('click', addProduct);
  document.getElementById('add-order-btn').addEventListener('click', addOrder);
  document.getElementById('add-purchase-btn').addEventListener('click', addPurchase);

  async function doLogin() {
    var u = document.getElementById('username').value;
    var p = document.getElementById('password').value;
    if (!u || !p) { showAlert('請填寫帳號密碼'); return; }
    var res = await fetch(API + '/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({username: u, password: p})
    });
    var data = await res.json();
    if (!res.ok) { showAlert(data.error || '登入失敗'); return; }
    token = data.token;
    user = data.user;
    localStorage.setItem('inv_token', token);
    document.getElementById('login-view').classList.add('hidden');
    document.getElementById('main-view').classList.remove('hidden');
    document.getElementById('user-info').textContent = user.name || user.username;
    loadCategories();
    showTab('inventory');
  }

  function doLogout() {
    localStorage.removeItem('inv_token');
    location.reload();
  }

  async function api(path, opts) {
    opts = opts || {};
    var headers = {'Content-Type':'application/json'};
    if (token) headers['Authorization'] = 'Bearer ' + token;
    var res = await fetch(API + path, {method: opts.method || 'GET', headers: headers, body: opts.body});
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || 'API錯誤');
    return data;
  }

  async function loadCategories() {
    try {
      var data = await api('/api/categories');
      var html = '<option value="">選擇分類</option>';
      data.forEach(function(c) { html += '<option value="' + c.id + '">' + c.name + '</option>'; });
      document.getElementById('p-category').innerHTML = html;
    } catch(e) { showAlert(e.message); }
  }

  async function loadInventory() {
    try {
      var data = await api('/api/inventory');
      if (!data.length) {
        document.getElementById('inventory-list').innerHTML = '<p style="color:#999">尚無庫存資料</p>';
        return;
      }
      var html = '<table><tr><th>SKU</th><th>名稱</th><th>分類</th><th>庫存</th><th>單位</th><th>單價</th><th>狀態</th></tr>';
      data.forEach(function(item) {
        var low = parseFloat(item.quantity) <= parseFloat(item.min_quantity);
        html += '<tr><td>' + (item.sku||'') + '</td><td>' + (item.name||'') + '</td><td>' + (item.category_name||'') + '</td><td class="' + (low?'low-stock':'') + '">' + item.quantity + '</td><td>' + (item.unit||'') + '</td><td>$' + (item.price||0) + '</td><td>' + (low?'低庫存':'正常') + '</td></tr>';
      });
      html += '</table>';
      document.getElementById('inventory-list').innerHTML = html;
    } catch(e) { showAlert(e.message); }
  }

  async function loadProducts() {
    try {
      var data = await api('/api/products');
      if (!data.length) {
        document.getElementById('products-list').innerHTML = '<p style="color:#999">尚無配件資料</p>';
        return;
      }
      var html = '<table><tr><th>SKU</th><th>名稱</th><th>分類</th><th>單位</th><th>單價</th></tr>';
      data.forEach(function(p) {
        html += '<tr><td>' + (p.sku||'') + '</td><td>' + (p.name||'') + '</td><td>' + (p.category_name||'') + '</td><td>' + (p.unit||'') + '</td><td>$' + (p.price||0) + '</td></tr>';
      });
      html += '</table>';
      document.getElementById('products-list').innerHTML = html;
    } catch(e) { showAlert(e.message); }
  }

  async function loadOrders() {
    try {
      var data = await api('/api/orders');
      if (!data.length) {
        document.getElementById('orders-list').innerHTML = '<p style="color:#999">尚無訂單</p>';
        return;
      }
      var html = '<table><tr><th>單號</th><th>客戶</th><th>日期</th><th>金額</th><th>狀態</th></tr>';
      data.forEach(function(o) {
        html += '<tr><td>' + (o.order_no||'') + '</td><td>' + (o.customer_name||'') + '</td><td>' + new Date(o.created_at).toLocaleDateString() + '</td><td>$' + (o.total_amount||0) + '</td><td>' + (o.status||'') + '</td></tr>';
      });
      html += '</table>';
      document.getElementById('orders-list').innerHTML = html;
    } catch(e) { showAlert(e.message); }
  }

  async function loadPurchases() {
    try {
      var data = await api('/api/purchases');
      if (!data.length) {
        document.getElementById('purchases-list').innerHTML = '<p style="color:#999">尚無進貨記錄</p>';
        return;
      }
      var html = '<table><tr><th>日期</th><th>配件</th><th>數量</th><th>單價</th><th>供應商</th></tr>';
      data.forEach(function(p) {
        html += '<tr><td>' + new Date(p.created_at).toLocaleDateString() + '</td><td>' + (p.product_name||'') + '</td><td>' + p.quantity + '</td><td>' + (p.price?'$'+p.price:'-') + '</td><td>' + (p.supplier||'-') + '</td></tr>';
      });
      html += '</table>';
      document.getElementById('purchases-list').innerHTML = html;
    } catch(e) { showAlert(e.message); }
  }

  async function addProduct() {
    var sku = document.getElementById('p-sku').value.trim();
    var name = document.getElementById('p-name').value.trim();
    var category_id = document.getElementById('p-category').value;
    var unit = document.getElementById('p-unit').value.trim();
    var price = parseFloat(document.getElementById('p-price').value) || 0;
    if (!sku || !name) { showAlert('請填寫 SKU 和名稱'); return; }
    try {
      await api('/api/products', {method:'POST', body: JSON.stringify({sku: sku, name: name, category_id: category_id||null, unit: unit, price: price})});
      showAlert('配件已新增');
      ['p-sku','p-name','p-unit','p-price'].forEach(function(id) { document.getElementById(id).value = ''; });
      document.getElementById('p-category').value = '';
      loadProducts();
    } catch(e) { showAlert(e.message); }
  }

  async function addOrder() {
    var product_id = document.getElementById('o-product').value;
    var quantity = parseFloat(document.getElementById('o-quantity').value);
    var price = parseFloat(document.getElementById('o-price').value) || 0;
    var customer_name = document.getElementById('o-customer').value.trim();
    if (!product_id || !quantity) { showAlert('請選擇配件並填寫數量'); return; }
    try {
      await api('/api/orders', {method:'POST', body: JSON.stringify({customer_name: customer_name, items: [{product_id: product_id, quantity: quantity, price: price}]})});
      showAlert('訂單已建立');
      ['o-customer','o-quantity','o-price'].forEach(function(id) { document.getElementById(id).value = ''; });
      document.getElementById('o-product').value = '';
      loadOrders();
      loadInventory();
    } catch(e) { showAlert(e.message); }
  }

  async function addPurchase() {
    var product_id = document.getElementById('pu-product').value;
    var quantity = parseFloat(document.getElementById('pu-quantity').value);
    var price = parseFloat(document.getElementById('pu-price').value) || 0;
    var supplier = document.getElementById('pu-supplier').value.trim();
    var notes = document.getElementById('pu-notes').value.trim();
    if (!product_id || !quantity) { showAlert('請選擇配件並填寫數量'); return; }
    try {
      await api('/api/purchases', {method:'POST', body: JSON.stringify({product_id: product_id, quantity: quantity, price: price, supplier: supplier, notes: notes})});
      showAlert('進貨已入庫');
      ['pu-quantity','pu-price','pu-supplier','pu-notes'].forEach(function(id) { document.getElementById(id).value = ''; });
      loadPurchases();
      loadInventory();
    } catch(e) { showAlert(e.message); }
  }

  // Init
  if (token) {
    document.getElementById('login-view').classList.add('hidden');
    document.getElementById('main-view').classList.remove('hidden');
    loadCategories();
    showTab('inventory');
  } else {
    document.getElementById('login-view').classList.remove('hidden');
    document.getElementById('main-view').classList.add('hidden');
  }
})();
</script>
</body>
</html>
