version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: fence
      POSTGRES_PASSWORD: fence123
      POSTGRES_DB: fence_inventory
    volumes:
      - ./data/db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fence"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://fence:fence123@db:5432/fence_inventory
      PORT: 3000
      JWT_SECRET: fence2024local
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm install && npm run db:init && npm run db:seed && npm start"
